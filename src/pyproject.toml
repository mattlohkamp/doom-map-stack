[project]
name = "dms"
version = "0.21.0"
description = "Doom map stack: write, check and play UDMF maps for UZDoom"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
dms = "dms.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

# pyproject.toml sits in src\ next to the package (the repo root holds only Start Session.cmd).
[tool.uv.build-backend]
module-root = ""
