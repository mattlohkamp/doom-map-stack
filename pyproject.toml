[project]
name = "dms"
version = "0.1.0"
description = "Doom map stack: write, check and play UDMF maps for UZDoom"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dms = "dms.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
